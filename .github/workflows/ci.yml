name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: "apk --debug" }
          - { os: macos-latest,   target: "ios --no-codesign --debug" }
          - { os: macos-latest,   target: "macos --debug" }
          - { os: windows-latest, target: "windows --debug" }
          - { os: ubuntu-latest,  target: "linux --debug" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev libsecret-1-dev
      - run: flutter pub get
      - if: matrix.target == 'apk --debug'
        run: flutter analyze && flutter test
      - run: flutter build ${{ matrix.target }} --dart-define-from-file=.env.local
